name: Nightly — ASan / mutation / soak

# Heavy gates that don't run per PR. Surface regressions overnight.

on:
  schedule:
    - cron: '0 3 * * *'           # daily 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  mutation:
    name: mutation testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin mutmut to <3.0 so the original --paths-to-mutate CLI works.
      # mutmut 3.x moved config into pyproject.toml and changed the results
      # output format too; rewiring against that is its own follow-up.
      # The mutation gate is advisory either way (informational, not blocking).
      - run: pip install hatch 'mutmut<3'
      - name: Mutate dispatch + normalize + errors + result
        continue-on-error: true
        run: |
          hatch env create
          mutmut run --paths-to-mutate src/knovas_extract/dispatch.py,src/knovas_extract/normalize.py,src/knovas_extract/errors.py,src/knovas_extract/result.py
      - name: Report mutation score (advisory)
        continue-on-error: true
        run: |
          KILLED=$(mutmut results 2>/dev/null | grep -E "killed" | awk '{print $NF}' || echo 0)
          SURVIVED=$(mutmut results 2>/dev/null | grep -E "survived" | awk '{print $NF}' || echo 0)
          TOTAL=$((KILLED + SURVIVED))
          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$(echo "scale=2; $KILLED * 100 / $TOTAL" | bc)
            echo "Mutation score: $SCORE% ($KILLED killed / $SURVIVED survived)"
            if [ "$(echo "$SCORE < 80" | bc)" = "1" ]; then
              echo "::warning::Mutation score $SCORE% is below the 80% target"
            fi
          else
            echo "::warning::No mutation results produced"
          fi

  fuzz-long:
    name: extended fuzz (30 min/target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install atheris && pip install -e .
      - name: Fuzz txt (30 min)
        run: timeout 1800 python tests/fuzz/fuzz_txt.py -atheris_runs=10000000 || [ $? -eq 124 ]
      - name: Fuzz md (30 min)
        run: timeout 1800 python tests/fuzz/fuzz_md.py -atheris_runs=10000000 || [ $? -eq 124 ]
