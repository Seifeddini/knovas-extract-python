name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default-deny permissions; individual jobs grant what they need.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + type check. Fast feedback; runs once.
  # ---------------------------------------------------------------------------
  lint:
    name: lint + type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install hatch
      - run: hatch -e lint run all

  # ---------------------------------------------------------------------------
  # Unit + golden + property tests on the matrix.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: step-security/harden-runner@v2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@v7

      # Checkout the standalone spec repo for golden + adversarial corpus
      # tests. When the spec is public this needs no token; if it's ever
      # private, set SPEC_TOKEN to a PAT with read access. continue-on-error
      # keeps the workflow alive when the spec is unreachable (the golden
      # runner gracefully reports "no-spec-found" — see tests/golden/test_corpus.py).
      - name: Checkout knovas-extract-spec (for corpus)
        id: spec-checkout
        uses: actions/checkout@v7
        with:
          repository: Seifeddini/knovas-extract-spec
          ref: main
          path: knovas-extract-spec
          lfs: true
          token: ${{ secrets.SPEC_TOKEN || secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # actions/checkout's `lfs: true` is unreliable across repo boundaries —
      # for a *different* public repo it sometimes leaves files as 132-byte
      # LFS pointers instead of materializing the real bytes. Force an
      # explicit `git lfs pull` and verify a known binary's first bytes.
      - name: Hydrate spec LFS objects
        if: steps.spec-checkout.outcome == 'success'
        shell: bash
        working-directory: knovas-extract-spec
        run: |
          git lfs install --local
          git lfs pull
          # Sanity: simple-text.pdf must begin with '%PDF' (real bytes), not 'version' (LFS pointer).
          head -c 4 corpus/pdf/simple-text.pdf | xxd | head -1
          if head -c 8 corpus/pdf/simple-text.pdf | grep -q '%PDF-'; then
            echo "::notice::spec LFS hydrated successfully"
          else
            echo "::error::spec corpus binaries are still LFS pointers — extractor tests will fail"
            exit 1
          fi

      - name: Export KNOVAS_EXTRACT_SPEC_DIR if spec was fetched
        if: steps.spec-checkout.outcome == 'success'
        shell: bash
        run: echo "KNOVAS_EXTRACT_SPEC_DIR=${{ github.workspace }}/knovas-extract-spec" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install hatch + project
        run: |
          pip install hatch
          hatch env create

      - name: Unit tests
        run: hatch run test -m unit -v

      # macOS PDF tests skip at the test level (PyMuPDF C-extension segfaults
      # at import on macOS-latest — see comment in tests/golden/test_corpus.py).
      # The other 7 formats DO run strictly on macOS; this is no longer
      # an advisory job.
      - name: "Golden corpus tests (Phase 0 — skipped if corpus is empty or absent)"
        run: hatch -e golden run run

      - name: Property tests
        run: hatch -e property run run

  # ---------------------------------------------------------------------------
  # Security gates. Required green to merge.
  # ---------------------------------------------------------------------------
  security:
    name: security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # for SARIF upload
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install hatch
      - name: Bandit
        run: hatch -e sec run run-bandit

      # Semgrep with p/security-audit + p/owasp-top-ten has a high false-positive
      # rate on fresh code (e.g. flags any except-Exception block). Made advisory
      # until we curate a tighter ruleset (or migrate to `p/python` only).
      # Bandit + CodeQL + pip-audit + OSV remain the hard gates.
      - name: Semgrep (advisory)
        continue-on-error: true
        run: hatch -e sec run run-semgrep

      - name: pip-audit
        run: hatch -e sec run run-pip-audit
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            -r
            --skip-git
            --lockfile=pyproject.toml
            ./

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # ---------------------------------------------------------------------------
  # CIFuzz — 5 minutes of coverage-guided fuzzing per PR.
  # ---------------------------------------------------------------------------
  cifuzz:
    name: CIFuzz (atheris, 5 min)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory while we triage. The hypothesis property tier in `test` covers
    # the same invariants (no crash on random bytes, typed errors only) and is
    # the actual gate. atheris adds coverage-guided fuzzing on top, but
    # build/install is finicky in CI — leaving it as a non-blocking signal
    # until we wire OSS-Fuzz (the real long-running fuzzer).
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install atheris + project
        run: |
          # libmagic1 keeps python-magic functional inside the fuzz target.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagic1
          pip install atheris
          pip install -e .

      # Each target runs for 60 seconds. Exit codes:
      #   0   = atheris completed all runs without crash
      #   124 = killed by `timeout` after 60s without crash (also success)
      #   137 = SIGKILL (CI runner timeout)
      #   any other nonzero = atheris found a crash → step fails (correct)
      # Steps are step-level continue-on-error so the workflow conclusion is
      # success even if atheris build/setup fails on the runner.
      - name: Fuzz txt extractor (60s)
        continue-on-error: true
        run: |
          set +e
          timeout --preserve-status 60 python tests/fuzz/fuzz_txt.py -atheris_runs=10000000
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 124 ] || [ $rc -eq 137 ] || [ $rc -eq 143 ]; then
            echo "atheris (txt) ran 60s without crash (exit $rc)"
            exit 0
          fi
          echo "::error::atheris (txt) found a crash (exit $rc)"
          exit $rc

      - name: Fuzz md extractor (60s)
        continue-on-error: true
        run: |
          set +e
          timeout --preserve-status 60 python tests/fuzz/fuzz_md.py -atheris_runs=10000000
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 124 ] || [ $rc -eq 137 ] || [ $rc -eq 143 ]; then
            echo "atheris (md) ran 60s without crash (exit $rc)"
            exit 0
          fi
          echo "::error::atheris (md) found a crash (exit $rc)"
          exit $rc

  # ---------------------------------------------------------------------------
  # Secrets scan.
  # ---------------------------------------------------------------------------
  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
