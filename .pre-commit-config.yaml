# pre-commit hooks. Install once: `pre-commit install`.
# Same gates the CI runs, just faster local feedback.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - types-PyYAML

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, src]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # DCO sign-off check — every commit must have "Signed-off-by:" trailer.
  - repo: https://github.com/sirosen/texthooks
    rev: 0.6.7
    hooks:
      - id: forbid-bidi-controls

  - repo: local
    hooks:
      - id: dco-sign-off
        name: DCO sign-off
        entry: bash -c 'git log -1 --pretty=%B | grep -q "^Signed-off-by:" || (echo "Commit message missing Signed-off-by trailer. Use: git commit -s"; exit 1)'
        language: system
        stages: [commit-msg]
        pass_filenames: false
